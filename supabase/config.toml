project_id = "teknofest-bilgi-yarismasi"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
port = 54321
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Proje oyuncuları kayıt olmadan, anonim oturumla (ensureAnonymousSession)
# odaya katılır (bkz. src/lib/supabase.ts). Bu nedenle anonim girişlerin
# açık olması zorunludur.
enable_anonymous_sign_ins = true
enable_signup = true

[auth.email]
enable_signup = false
enable_confirmations = false

[realtime]
enabled = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
